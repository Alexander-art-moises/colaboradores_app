
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema 360° · Planta Óxidos</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #202b3d; min-height: 100vh; }

#pantalla-carga {
  min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: #1f3055; gap: 20px;
}
.spinner {
  width: 48px; height: 48px;
  border: 5px solid rgba(255,255,255,0.2);
  border-top-color: #ff7300; border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.carga-texto { color: rgba(255,255,255,0.7); font-size: 14px; }

#pantalla-pin {
  min-height: 100vh; width: 100%; display: none;
  flex-direction: column; align-items: center;
  justify-content: flex-end; padding-bottom: 20%;
  background-image: url('https://raw.githubusercontent.com/Alexander-art-moises/operadores_app/main/FONDO%20DE%20FONDOS.png');
  background-size: cover; background-position: center top; background-repeat: no-repeat;
}
@media (min-width: 768px) {
  #pantalla-pin {
    background-image: url('https://raw.githubusercontent.com/Alexander-art-moises/colaboradores_app/main/PARA_PC.png');
    background-size: cover; background-position: center center;
    justify-content: center; padding-bottom: 0;
  }
  .pin-card { max-width: 380px; }
  .pin-frase { display: none; }
}
.pin-card {
  width: 80%; max-width: 300px; display: flex;
  flex-direction: column; align-items: center; gap: 14px;
}
.pin-input {
  width: 100%; padding: 5px; font-size: 28px; text-align: center;
  letter-spacing: 12px; border: 2px solid #ff8a00; border-radius: 14px;
  outline: none; color: #ff8a00; background: rgba(255,255,255,0.88);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
.pin-input:focus { border-color: #ff8a00; background: rgba(255,255,255,0.97); }
.pin-input::placeholder { color: #ff8a00; opacity: 1; }
.btn-entrar {
  width: 100%; padding: 15px; background: #1F4E79; color: white;
  border: none; border-radius: 14px; font-size: 16px; font-weight: bold;
  cursor: pointer; letter-spacing: 2px;
}
.btn-entrar:hover { background: #2E75B6; }
.pin-error {
  color: #fff; background: rgba(192,0,0,0.80); padding: 7px 16px;
  border-radius: 8px; font-size: 13px; text-align: center; display: none; width: 100%;
}
.pin-frase {
  color: white; font-size: 20px; font-style: italic; font-weight: bold;
  text-align: center; line-height: 1.6; margin-top: 6px;
  text-shadow: 1px 1px 4px rgba(0,0,0,0.5);
}

#pantalla-pare {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  z-index: 500; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.55); backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px); padding: 32px 24px; gap: 20px;
}
.pare-imagen { width: 85%; max-width: 280px; }
.pare-lista { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 8px; }
.pare-item {
  background: #8B0000; border-radius: 10px; padding: 10px 14px;
  color: white; font-size: 13px; font-weight: bold;
  display: flex; align-items: center; gap: 8px;
}
.pare-item::before { content: "⚠"; font-size: 16px; }
.btn-pare-continuar {
  width: 100%; max-width: 320px; padding: 14px; background: #1f3055; color: white;
  border: none; border-radius: 14px; font-size: 14px; font-weight: bold;
  cursor: pointer; letter-spacing: 1px; text-align: center; margin-top: 4px;
}
.btn-pare-continuar:hover { background: #264984; }

#pantalla-lista { display: none; max-width: 420px; margin: 0 auto; padding-bottom: 32px; }
.lista-header {
  background: #1f3055; padding: 16px 20px;
  display: flex; align-items: center; justify-content: space-between;
}
.lista-header h2 { color: white; font-size: 16px; }
.lista-buscar { padding: 12px 14px; background: #202b3d; }
.lista-buscar input {
  width: 100%; padding: 10px 14px; border-radius: 10px;
  border: 2px solid #354466; background: #2a3650;
  color: white; font-size: 14px; outline: none;
}
.lista-buscar input::placeholder { color: #8899bb; }
.lista-buscar input:focus { border-color: #ff7300; }
.lista-items { padding: 0 14px; }
.lista-item {
  background: white; border-radius: 10px; padding: 12px 14px;
  margin-bottom: 8px; display: flex; align-items: center; gap: 12px;
  cursor: pointer; border: 1px solid #e0e0e0;
}
.lista-item:hover { background: #f0f4ff; border-color: #c5d3ea; }
.lista-avatar {
  width: 44px; height: 44px; border-radius: 50%; background: #264984;
  border: 2px solid #ff7300; display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: bold; color: white; flex-shrink: 0; overflow: hidden;
}
.lista-avatar img { width: 100%; height: 100%; object-fit: cover; }
.lista-info { flex: 1; min-width: 0; }
.lista-nombre { font-size: 13px; font-weight: bold; color: #1f3055; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lista-cargo  { font-size: 11px; color: #888; margin-top: 2px; }
.pare-badge   { width: 36px; height: 36px; flex-shrink: 0; }

#pantalla-perfil { display: none; max-width: 420px; margin: 0 auto; padding-bottom: 0; }
.header-band {
  background: #1f3055; padding: 20px 20px 24px;
  display: flex; align-items: center; gap: 16px;
}
.avatar {
  width: 64px; height: 64px; border-radius: 50%; object-fit: cover;
  border: 3px solid #ff7300; background: #264984; flex-shrink: 0;
}
.avatar-fallback {
  width: 64px; height: 64px; border-radius: 50%; background: #264984;
  border: 3px solid #ff7300; display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: bold; color: white; flex-shrink: 0;
}
.header-info { flex: 1; }
.header-info h1 { font-size: 16px; font-weight: bold; color: #ffffff; margin-bottom: 3px; }
.header-slogan  { font-size: 13px; color: #ff7300; margin-bottom: 2px; }
.header-dni     { font-size: 11px; color: #ffffff; margin-top: 3px; }

.info-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  padding: 14px; background: #202b3d;
}
.info-box {
  background: white; border-radius: 10px; padding: 10px 12px; border: 1px solid #c5d3ea;
}
.info-box label { font-size: 11px; color: #888; display: block; margin-bottom: 2px; }
.info-box span  { font-size: 13px; font-weight: bold; color: #1f3055; }
.btn-mapa {
  background: #1f3055; color: white; border: none; border-radius: 8px;
  padding: 6px 12px; font-size: 12px; font-weight: bold; cursor: pointer;
  width: 100%; text-align: left; margin-top: 2px;
}
.btn-mapa:hover { background: #264984; }
.dropdown-mapa { display: none; flex-direction: column; gap: 4px; margin-top: 4px; }
.dropdown-mapa.abierto { display: flex; }

/* ══ BOTÓN REPORTE 360 ══ */
.btn-reporte360 {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: calc(100% - 28px); margin: 14px 14px 0;
  padding: 14px 20px; background: #ff7300; color: white;
  border: none; border-radius: 14px; font-size: 15px; font-weight: bold;
  cursor: pointer; letter-spacing: 0.5px;
  box-shadow: 0 4px 16px rgba(255,115,0,0.25);
}
.btn-reporte360:hover { background: #e06500; }
.btn-reporte360:active { transform: scale(0.98); }
.btn-reporte360-icon { font-size: 20px; }

.seccion { padding: 0 14px 6px; }
.seccion-titulo {
  font-size: 11px; font-weight: bold; color: #ff7300;
  text-transform: uppercase; letter-spacing: 0.05em;
  padding: 14px 0 8px; border-bottom: 1px solid #ffe0c0; margin-bottom: 10px;
}
.riesgos-wrap { display: flex; flex-direction: column; gap: 6px; }
.riesgo-tag {
  background: #fff8f0; color: #cc5e00; font-size: 12px;
  padding: 5px 11px; border-radius: 20px; border: 1.5px solid #ff7300; font-weight: bold;
}

.tabs {
  display: flex; background: white; border-bottom: 2px solid #c5d3ea;
  margin: 14px 0 0; position: sticky; top: 0; z-index: 10;
}
.tab {
  flex: 1; text-align: center; padding: 11px 4px; font-size: 12px;
  color: #888; cursor: pointer; border-bottom: 3px solid transparent;
  margin-bottom: -2px; font-weight: bold;
}
.tab.activa { color: #1f3055; border-bottom-color: #ff7300; }
.tab-content { display: none; padding: 4px 14px 8px; background: #202b3d; }
.tab-content.activa { display: block; }

.doc-item {
  background: white; border-radius: 10px; padding: 12px 14px;
  margin-bottom: 8px; border: 1px solid #e0e0e0;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.doc-info   { flex: 1; min-width: 0; }
.doc-tipo   { font-size: 10px; color: #888; margin-bottom: 2px; text-transform: uppercase; }
.doc-nombre { font-size: 13px; font-weight: bold; color: #1f3055; margin-bottom: 3px;
              white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.doc-fecha  { font-size: 11px; color: #888; }
.doc-derecha { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }

.badge { font-size: 11px; font-weight: bold; padding: 3px 10px; border-radius: 20px; white-space: nowrap; }
.badge-VIGENTE    { background: #E2EFDA; color: #375623; border: 1px solid #A9D18E; }
.badge-POR-VENCER { background: #FFF2CC; color: #7F5B00; border: 1px solid #FFD966; }
.badge-VENCIDO    { background: #FCE4D6; color: #833C00; border: 1px solid #F4B183; }

.btn-pdf {
  font-size: 11px; color: #1f3055; background: #e8eef8;
  border: 1px solid #c5d3ea; border-radius: 6px;
  padding: 4px 10px; cursor: pointer; font-weight: bold;
}
.btn-pdf:hover { background: #c5d3ea; }

#visor-pdf {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7); z-index: 1000; flex-direction: column;
}
.visor-header {
  background: #1f3055; padding: 12px 16px;
  display: flex; align-items: center; justify-content: space-between;
}
.visor-header span { color: white; font-size: 14px; font-weight: bold; }
.btn-cerrar {
  background: rgba(255,255,255,0.2); color: white; border: none;
  border-radius: 6px; padding: 6px 14px; font-size: 13px; cursor: pointer; font-weight: bold;
}
#iframe-pdf { flex: 1; border: none; width: 100%; }

.btn-salir {
  display: block; width: 100%; margin: 14px 0 0; padding: 13px;
  background: #C00000; color: white; border: none;
  font-size: 13px; text-align: center; cursor: pointer; font-weight: bold;
}
.btn-salir:hover { background: #a00000; }
.sin-datos { text-align: center; color: #aaa; font-size: 13px; padding: 20px 0; }
</style>
</head>
<body>

<div id="pantalla-carga">
  <div class="spinner"></div>
  <p class="carga-texto">Cargando datos...</p>
</div>

<div id="pantalla-pin">
  <div class="pin-card">
    <input class="pin-input" type="password" id="input-pin"
           maxlength="6" placeholder="••••" inputmode="numeric" pattern="[0-9]*"
           onkeydown="if(event.key==='Enter') verificarPin()">
    <button class="btn-entrar" onclick="verificarPin()">INGRESAR</button>
    <p class="pin-error" id="pin-error">PIN incorrecto. Intenta nuevamente.</p>
    <p class="pin-frase">Cada tarea, cada turno,<br>cada decisión importa.<br>Tú eres lo más valioso de<br>esta operación.</p>
  </div>
</div>

<div id="pantalla-pare">
  <img class="pare-imagen"
       src="https://raw.githubusercontent.com/Alexander-art-moises/operadores_app/main/TARJETA_PARE.png"
       alt="Tarjeta PARE">
  <div class="pare-lista" id="pare-lista"></div>
  <button class="btn-pare-continuar" onclick="continuarAlPerfil()">ENTENDIDO — VER MI PERFIL</button>
</div>

<div id="pantalla-lista">
  <div class="lista-header">
    <h2>Selecciona un colaborador</h2>
    <button class="btn-cerrar" onclick="cerrarSesion()">✕ Salir</button>
  </div>
  <div class="lista-buscar">
    <input type="text" id="lista-search" placeholder="Buscar por nombre..." oninput="filtrarLista()">
  </div>
  <div class="lista-items" id="lista-items"></div>
</div>

<div id="pantalla-perfil">
  <div class="header-band">
    <div id="avatar-container"></div>
    <div class="header-info">
      <h1 id="op-nombre"></h1>
      <p class="header-slogan" id="op-cargo"></p>
      <p class="header-dni" id="op-dni"></p>
    </div>
  </div>
  <div class="info-grid">
    <div class="info-box"><label>Área</label><span id="op-area"></span></div>
    <div class="info-box"><label>Años en empresa</label><span id="op-antiguedad"></span></div>
    <div class="info-box"><label>Puesto</label><span id="op-puesto"></span></div>
    <div class="info-box" id="box-mapa"><label>Mapa de Riesgos</label><div id="op-mapa"></div></div>
  </div>

  <!-- ══ BOTÓN REPORTE 360 ══ -->
  <button class="btn-reporte360" id="btn-reporte360" onclick="abrirReporte360()">
    <span class="btn-reporte360-icon">📋</span>
    Reporte 360°
  </button>

  <div class="seccion">
    <div class="seccion-titulo">Riesgos críticos del área</div>
    <div class="riesgos-wrap" id="op-riesgos"></div>
  </div>

  <!-- Solo 2 tabs ahora: Capacitaciones y Certificaciones -->
  <div class="tabs">
    <div class="tab activa" onclick="cambiarTab(0)">Capacitaciones</div>
    <div class="tab"        onclick="cambiarTab(1)">Certificaciones</div>
  </div>
  <div class="tab-content activa" id="tab-capacitaciones"></div>
  <div class="tab-content"        id="tab-certificaciones"></div>

  <button class="btn-salir" onclick="cerrarSesion()">Cerrar sesión</button>
</div>

<div id="visor-pdf">
  <div class="visor-header">
    <span id="visor-titulo">Documento</span>
    <button class="btn-cerrar" onclick="cerrarPDF()">✕ Cerrar</button>
  </div>
  <iframe id="iframe-pdf" allowfullscreen></iframe>
</div>
